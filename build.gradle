plugins {
    id 'de.undercouch.download' version '5.6.0'
    id 'java'
}

version = '1.2.0'

// The Java version MUST match the JRE bundled with the latest IBKR TWS,
// because this extension runs as a -javaagent inside the TWS JVM.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['src']
        }
    }

    test {
        java {
            srcDirs = ['test']
        }
        resources {
            srcDirs = ['test']
        }
    }
}

def twsApiDir = layout.buildDirectory.dir('dependencies/twsapi')

// @seeAlso https://github.com/michel-kraemer/gradle-download-task
tasks.register('downloadTWSAPIZipFile', Download) {
    src 'https://interactivebrokers.github.io/downloads/twsapi_macunix.1037.02.zip'
    dest layout.buildDirectory.file('dependencies/twsapi.zip')
}

tasks.register('downloadAndUnzipTWSAPI', Copy) {
    dependsOn 'downloadTWSAPIZipFile'
    from { zipTree(tasks.named('downloadTWSAPIZipFile').get().dest) }
    into twsApiDir
}

tasks.named('compileJava') {
    dependsOn 'downloadAndUnzipTWSAPI'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation files(twsApiDir.map { it.file('IBJts/source/JavaClient/TwsApi.jar') })
    implementation fileTree(dir: twsApiDir.map { it.dir('IBJts/source/JavaClient/jars') })
    implementation 'javax.json:javax.json-api:1.1'
    implementation 'org.glassfish:javax.json:1.1'
    implementation 'commons-cli:commons-cli:1.4'
    implementation 'org.aspectj:aspectjrt:1.9.25.1'
    implementation 'org.aspectj:aspectjweaver:1.9.25.1'
    testImplementation 'junit:junit:4.13'
}

jar {
    manifest {
        attributes(
            "Implementation-Title": "IB TWS JSON",
            "Implementation-Version": project.version,
            "Main-Class": "com.meerkattrading.tws.Launcher",
            "Premain-Class": "com.meerkattrading.tws.Agent",
            "Agent-Class": "com.meerkattrading.tws.Agent",
            "Can-Redefine-Classes": "true"
        )
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude('com/ib/**')
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
